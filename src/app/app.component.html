<div>
  <h1>All my wishes</h1>
</div>

<div *ngIf="wishes.length === 0; else showWishList">
  <p>No wishes yet</p>
</div>

<ng-template #showWishList>
  <ul *ngFor="let wish of wishes; let idx = index">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" [id]="idx" value="option{{idx}}" [checked]="wish.isCompleted">
      <label class="form-check-label" [for]="idx">{{ wish.wishName }}</label>
    </div>
  </ul>
</ng-template>
