<div>
  <h1>All my wishes</h1>
</div>

<div *ngIf="wishes.length === 0; else showWishList">
  <p>No wishes yet</p>
</div>

<ng-template #showWishList>
  <ul *ngFor="let wish of wishes">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
      <label class="form-check-label" for="inlineCheckbox1">{{ wish.wishName }}</label>
    </div>
  </ul>
</ng-template>
