<div class="container">
  <div class="p-3">
    <h1>All my wishes</h1>
  </div>

  <app-add-wish-form
    [wishes]="filteredWishes"
    (addNewWish)="wishes.push($event)"
  >
  </app-add-wish-form>

  <div class="p-3">
    <select class="form-select w-50" aria-label="Filter wishes"
            [(ngModel)]="filterValueSelected"
    >
      <option value="0">All</option>
      <option value="1">Fulfilled</option>
      <option value="2">Unfulfilled</option>
    </select>
  </div>

  <app-wish-list-show
    [wishes]="filteredWishes"
    [filterValueSelected]="filterValueSelected"
  >
  </app-wish-list-show>
</div>
