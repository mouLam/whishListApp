<div class="p-3">
  <div *ngIf="wishes.length === 0; else showWishList">
    <p>No wishes yet</p>
  </div>

  <ng-template #showWishList>
    <ul class="wish-list">
      <app-wish-list-item
        *ngFor="let wish of wishes; let idx = index"
        [wishText]="wish.wishName"
        [idx]="idx"
        [(fulfilled)]="wish.isCompleted"
      >
      </app-wish-list-item>
    </ul>
  </ng-template>
</div>
