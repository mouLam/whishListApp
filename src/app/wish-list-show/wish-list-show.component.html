<div class="p-3">
  <div *ngIf="wishes.length === 0; else showWishList">
    <p>No wishes yet</p>
  </div>

  <ng-template #showWishList>
    <ul class="wish-list">
      <div class="col-sm-6">
        <app-wish-list-item
          *ngFor="let wish of wishes; let idx = index"
          [wish]="wish"
          [idx]="idx"
        >
        </app-wish-list-item>
      </div>
    </ul>
  </ng-template>
</div>
