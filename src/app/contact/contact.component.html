<div class="container p-3">
  <h2>Testing Reactive Form</h2>
</div>
<form class="container p-5"
      [formGroup]="contactForm"
      (ngSubmit)="$event.preventDefault(); submitForm()"
>
  <div class="mb-3">
    <label class="form-label">Your name *</label>
    <input type="text" class="form-control" formControlName="name">
    <div
      *ngIf="contactForm.get('name')?.invalid
              && contactForm.get('name')?.dirty
              || contactForm.get('name')?.touched"  >
      <small
        class="text-danger"
        *ngIf="contactForm.get('name')?.hasError('required')"
      >The name is required.</small>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Your email address *</label>
    <input type="email" class="form-control" aria-describedby="emailHelp" formControlName="email">
    <div
      *ngIf="contactForm.get('email')?.invalid
              && contactForm.get('email')?.dirty
              || contactForm.get('email')?.touched"  >
      <small
        class="text-danger"
        *ngIf="contactForm.get('email')?.hasError('required')"
      >Email is required.</small>

      <small
        class="text-danger"
        *ngIf="contactForm.get('email')?.hasError('email')"
      >Email is invalid.</small>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Message *</label>
    <textarea class="form-control" rows="3" formControlName="message"></textarea>

    <div
      *ngIf="contactForm.get('message')?.invalid
              && contactForm.get('message')?.dirty
              || contactForm.get('message')?.touched"  >
      <small
        class="text-danger"
        *ngIf="contactForm.get('message')?.hasError('required')"
      >The message is required.</small>

      <small
        class="text-danger"
        *ngIf="contactForm.get('message')?.hasError('minlength')"
      >The message has to be at least
        {{
          contactForm.get('message')?.errors?.['minlength']?.requiredLength
        }}
        characters long.</small>
    </div>
  </div>
  <div class="mb-3">
    <button type="submit" class="btn btn-primary"
            [disabled]="contactForm.invalid"
    >Send Message</button>
  </div>
</form>
